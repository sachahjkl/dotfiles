<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
	<alias>
		<family>serif</family>
		<prefer>
			<family>Roboto</family>
			<family>Segoe UI</family>
			<family>Linux Libertine</family>
			<family>Joy Pixels</family>
			<family>Noto Color Emoji</family>
			<family>Font Awesome 5 Brands</family>
		</prefer>
	</alias>
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>Roboto</family>
			<family>Segoe UI</family>
			<family>Linux Biolinum</family>
			<family>Joy Pixels</family>
			<family>Noto Color Emoji</family>
			<family>Font Awesome 5 Brands</family>
		</prefer>
	</alias>
	<alias>
		<family>sans</family>
		<prefer>
			<family>Roboto</family>
			<family>Segoe UI</family>
			<family>Linux Biolinum</family>
			<family>Joy Pixels</family>
			<family>Noto Color Emoji</family>
			<family>Font Awesome 5 Brands</family>
		</prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer>
			<family>Cascadia Code PL</family>
			<family>Cascadia Code</family>
			<family>Fira Code</family>
			<family>JetBrainsMono Medium</family>
			<family>Noto Sans Mono</family>
			<family>Liberation Mono</family>
		</prefer>
	</alias>

	<!--
      Some websites and app have Helvetica, Times and Terminal values
      hardcoded as fonts to be used. We tell them to use our fonts instead.
    -->
    <match target="pattern">
      <test name="family" qual="any">
          <string>Helvetica</string>
      </test>
      <edit name="family" mode="assign" binding="same">
          <string>sans-serif</string>
      </edit>
    </match>
    <match target="pattern">
      <test name="family" qual="any">
        <string>Times</string>
      </test>
      <edit name="family" mode="assign" binding="same">
        <string>serif</string>
      </edit>
    </match>
    <match target="pattern">
      <test name="family" qual="any">
        <string>Courier</string>
      </test>
      <edit name="family" mode="assign" binding="same">
        <string>monospace</string>
      </edit>
    </match>
    <match target="pattern">
      <test name="family" qual="any">
        <string>Terminal</string>
      </test>
      <edit name="family" mode="assign" binding="same">
        <string>monospace</string>
      </edit>
    </match>

	<!-- Font options -->
	<match target="font">
		<edit mode="assign" name="autohint">
			<bool>false</bool>
		</edit>
		<edit mode="assign" name="hinting">
			<bool>true</bool>
		</edit>
		<edit mode="assign" name="hintstyle">
			<const>hintslight</const>
		</edit>
		<edit mode="assign" name="lcdfilter">
			<const>lcddefault</const>
		</edit>
		<edit mode="assign" name="antialias">
			<bool>true</bool>
		</edit>
		<edit mode="assign" name="rgba">
			<const>rgb</const>
		</edit>
		<edit mode="assign" name="dpi">
			<double>96</double>
		</edit>
	</match>


</fontconfig>
